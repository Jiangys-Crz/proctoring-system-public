# Relay and exam streams share media; authentication and path rules stay separate.
services:
  web:
    environment:
      LIVE_RELAY_ENABLED: "1"
      LIVE_RELAY_AUTH_SECRET: ${LIVE_RELAY_AUTH_SECRET:?set a random base64url secret of at least 32 characters}
      LIVE_RELAY_PUBLIC_BASE: ${LIVE_RELAY_PUBLIC_BASE:-}
      LIVE_RELAY_MAX_STREAMS: ${LIVE_RELAY_MAX_STREAMS:-8}
      LIVE_RELAY_MAX_CONNECTIONS: ${LIVE_RELAY_MAX_CONNECTIONS:-16}
      LIVE_RELAY_RTMP_PORT: ${LIVE_RELAY_RTMP_PORT:-1940}
      LIVE_RELAY_RTMP_PUBLIC_BASE: ${LIVE_RELAY_RTMP_PUBLIC_BASE:-}
  media:
    ports:
      - "${LIVE_RELAY_RTMP_BIND:-0.0.0.0}:${LIVE_RELAY_RTMP_PORT:-1940}:1935/tcp"
