# Legacy dedicated configuration, retained for old-release reference only.
# Current Compose uses mediamtx.caddy.yml / mediamtx.yml for shared media.
logLevel: warn
api: true
apiAddress: :9997
authMethod: http
authHTTPExclude: []
# Overridden by the optional compose overlay with a private callback secret.
authHTTPAddress: http://web:4031/api/live-relay/media-auth
readTimeout: 10s
writeTimeout: 10s
writeQueueSize: 64
rtsp: false
srt: false
webrtc: true
webrtcAddress: :8889
webrtcAllowOrigins: ['*']
webrtcLocalUDPAddress: :1940
webrtcLocalTCPAddress: :1940
webrtcIPsFromInterfaces: false
# OBS starts its encoders after WHIP negotiation. Allow bounded startup time
# before declaring the publisher empty; this does not add a playback buffer.
webrtcTrackGatherTimeout: 15s
# Override via MTX_WEBRTCADDITIONALHOSTS with this server's reachable address.
moq: false
playback: false
rtmp: false
hls: false
pathDefaults:
  source: publisher
  overridePublisher: false
  record: false
  maxReaders: 16
paths:
  '~^relay/[A-Za-z0-9_-]{1,64}$':
