name: CwnupaaProctor
options:
  bundleIdPrefix: org.cwnupaa
  deploymentTarget:
    iOS: "14.0"
packages:
  HaishinKit:
    url: https://github.com/shogo4405/HaishinKit.swift
    from: 1.6.0
targets:
  CwnupaaProctor:
    type: application
    platform: iOS
    sources:
      - CwnupaaProctor
    dependencies:
      - package: HaishinKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.cwnupaa.proctor
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: CwnupaaProctor/Info.plist
      properties:
        CFBundleDisplayName: CWNU PAA 第二机位
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: 用于第二机位监考画面与身份核验
        NSMicrophoneUsageDescription: 用于监考语音对话与环境视频录音
        NSLocalNetworkUsageDescription: 用于连接监考局域网服务器
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
